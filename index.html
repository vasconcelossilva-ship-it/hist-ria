<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Interativa</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#b6ffc2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

#jogo{
    background:white;
    width:500px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    text-align:center;
}

h1{
    color:#c1121f;
}

button{
    display:block;
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#e63946;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#9d0208;
}
</style>

</head>
<body>

<div id="jogo">
    <h1>🍕 Pizzaria do Chef</h1>

    <p id="historia"></p>

    <button id="opcao1"></button>
    <button id="opcao2"></button>
</div>

<script src="script.js"></script>

</body>
</html>
